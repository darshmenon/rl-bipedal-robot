<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humanoid Voice Control</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151c;
    --panel-2: #171b24;
    --border: #232836;
    --text: #e7eaf0;
    --text-dim: #8891a3;
    --accent: #5b8cff;
    --accent-dim: #2c3a63;
    --good: #3ddc84;
    --bad: #ff5d6c;
    --warn: #ffb020;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 4px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  .conn {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--bad);
    box-shadow: 0 0 0 3px rgba(255,93,108,0.15);
    transition: background 0.2s, box-shadow 0.2s;
  }
  .dot.on {
    background: var(--good);
    box-shadow: 0 0 0 3px rgba(61,220,132,0.15);
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 4px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--accent);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .bubble.assistant {
    align-self: flex-start;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bubble.system {
    align-self: center;
    background: transparent;
    color: var(--text-dim);
    font-size: 12.5px;
  }
  .action-badge {
    align-self: flex-start;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--panel);
  }
  .action-badge .tag {
    color: var(--accent);
    font-weight: 600;
  }
  .action-badge.ok { color: var(--good); }
  .action-badge.fail { color: var(--bad); }

  footer {
    padding: 18px 4px 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  #status {
    font-size: 13px;
    color: var(--text-dim);
    min-height: 16px;
  }
  #mic {
    width: 74px;
    height: 74px;
    border-radius: 50%;
    border: none;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.2s, box-shadow 0.2s;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #mic svg { width: 28px; height: 28px; }
  #mic:active { transform: scale(0.96); }
  #mic.recording {
    background: var(--bad);
    border-color: var(--bad);
    box-shadow: 0 0 0 10px rgba(255,93,108,0.12);
  }
  #mic.thinking {
    background: var(--accent-dim);
    border-color: var(--accent);
  }
  #mic.speaking {
    background: var(--accent-dim);
    border-color: var(--accent);
    box-shadow: 0 0 0 10px rgba(91,140,255,0.14);
  }
  #hint {
    font-size: 11.5px;
    color: var(--text-dim);
  }
  .typebar {
    width: 100%;
    display: flex;
    gap: 8px;
  }
  .typebar input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
  }
  .typebar input:focus { border-color: var(--accent); }
  .typebar button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 0 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
  }
  .typebar button:hover { color: var(--text); }
</style>
</head>
<body>
  <header>
    <h1>Humanoid Voice Control</h1>
    <div class="conn"><span class="dot" id="dot"></span><span id="connText">connecting…</span></div>
  </header>

  <div id="log"></div>

  <footer>
    <div id="status">Hold the mic and speak</div>
    <button id="mic" title="Hold to talk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>
    <div id="hint">hold to talk &nbsp;·&nbsp; or type below</div>
    <div class="typebar">
      <input id="textInput" type="text" placeholder="Type a command or message…" />
      <button id="sendBtn">Send</button>
    </div>
  </footer>

<script>
const log = document.getElementById('log');
const dot = document.getElementById('dot');
const connText = document.getElementById('connText');
const statusEl = document.getElementById('status');
const micBtn = document.getElementById('mic');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');

let ws = null;
let mediaRecorder = null;
let chunks = [];
let audioCtx = null;

function addBubble(role, text) {
  const el = document.createElement('div');
  el.className = 'bubble ' + role;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function addActionBadge(action, success, message) {
  const el = document.createElement('div');
  el.className = 'action-badge ' + (success ? 'ok' : 'fail');
  el.innerHTML = `<span class="tag">${action}</span> ${success ? '✓' : '✗'} ${message ?? ''}`;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function setStatus(text) { statusEl.textContent = text; }

function setMicState(state) {
  micBtn.classList.remove('recording', 'thinking', 'speaking');
  if (state) micBtn.classList.add(state);
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    dot.classList.add('on');
    connText.textContent = 'connected';
  };
  ws.onclose = () => {
    dot.classList.remove('on');
    connText.textContent = 'disconnected — retrying…';
    setTimeout(connect, 1500);
  };
  ws.onerror = () => ws.close();

  ws.onmessage = async (evt) => {
    if (typeof evt.data === 'string') {
      const msg = JSON.parse(evt.data);
      handleMessage(msg);
    } else {
      const buf = evt.data instanceof Blob ? await evt.data.arrayBuffer() : evt.data;
      playAudio(buf);
    }
  };
}

function handleMessage(msg) {
  switch (msg.type) {
    case 'ready':
      setStatus('Hold the mic and speak');
      break;
    case 'transcript':
      if (msg.text) addBubble('user', msg.text);
      setStatus('Thinking…');
      setMicState('thinking');
      break;
    case 'assistant':
      addBubble('assistant', msg.text);
      break;
    case 'action_result':
      addActionBadge(msg.action, msg.success, msg.message);
      break;
  }
}

async function playAudio(arrayBuffer) {
  setMicState('speaking');
  setStatus('Speaking…');
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  try {
    const buf = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    src.onended = () => { setMicState(null); setStatus('Hold the mic and speak'); };
    src.start();
  } catch (e) {
    setMicState(null);
    setStatus('Hold the mic and speak');
  }
}

// --- push to talk recording ---
async function startRecording() {
  if (!navigator.mediaDevices) { setStatus('Microphone not available'); return; }
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  chunks = [];
  mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
  mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach((t) => t.stop());
    const blob = new Blob(chunks, { type: 'audio/webm' });
    if (blob.size > 500 && ws && ws.readyState === WebSocket.OPEN) {
      setStatus('Transcribing…');
      ws.send(await blob.arrayBuffer());
    } else {
      setMicState(null);
      setStatus('Hold the mic and speak');
    }
  };
  mediaRecorder.start();
  setMicState('recording');
  setStatus('Listening…');
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
}

micBtn.addEventListener('mousedown', startRecording);
micBtn.addEventListener('mouseup', stopRecording);
micBtn.addEventListener('mouseleave', () => { if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording(); });
micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });

function sendText() {
  const text = textInput.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  addBubble('user', text);
  ws.send(JSON.stringify({ type: 'text', text }));
  textInput.value = '';
  setStatus('Thinking…');
}
sendBtn.addEventListener('click', sendText);
textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendText(); });

connect();
</script>
</body>
</html>
